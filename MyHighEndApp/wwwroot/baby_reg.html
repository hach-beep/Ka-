<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>تسجيل طفل جديد - BabyGuard</title>
    <style>
        body { background: #f0f9ff; font-family: sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .card { background: white; padding: 30px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); width: 350px; text-align: center; }
        input { width: 100%; padding: 12px; margin: 10px 0; border: 1px solid #ddd; border-radius: 8px; box-sizing: border-box; }
        button { width: 100%; padding: 15px; background: #2a9d8f; color: white; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; }
    </style>
</head>
<body>
    <div class="card">
        <h2>تسجيل طفل جديد</h2>
        <input type="text" id="name" placeholder="اسم الطفل الثلاثي">
        <input type="date" id="dob">
        <input type="tel" id="phone" placeholder="رقم هاتف الأم">
        <button onclick="saveBaby()">حفظ وفتح الملف</button>
    </div>

    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>
    <script>
        const firebaseConfig = {
            apiKey: "AizasyAX35fTT2-D90QgKQkzgnJCQtcN0S2LWq",
            authDomain: "babyguard-system.firebaseapp.com",
            projectId: "babyguard-system",
            storageBucket: "babyguard-system.appspot.com",
            messagingSenderId: "834481617596",
            appId: "1:834481617596:web:868391d8b73a5feabc6b9"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        function saveBaby() {
            const n = document.getElementById('name').value;
            const d = document.getElementById('dob').value;
            const p = document.getElementById('phone').value;
            if(!n || !d) return alert("يرجى ملئ البيانات");

            db.collection("babies").add({
                name: n, dob: d, phone: p, completed: [0]
            }).then(doc => {
                window.location.href = "baby_dash.html?id=" + doc.id;
            }).catch(err => alert("Error: " + err.message));
        }
    </script>
</body>
</html>
