<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>إعدادات العيادة - Clinco</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <style>
        :root { --primary: #5b8dfa; --bg: #f4f7f6; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); padding: 20px; }
        .card { background: white; padding: 20px; border-radius: 20px; max-width: 500px; margin: auto; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        h2 { color: var(--primary); border-bottom: 2px solid #eee; padding-bottom: 10px; }
        label { display: block; margin-top: 15px; font-weight: bold; font-size: 0.9rem; }
        input, select { width: 100%; padding: 12px; margin-top: 5px; border: 1px solid #ddd; border-radius: 10px; box-sizing: border-box; }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .btn-save { background: var(--primary); color: white; border: none; width: 100%; padding: 15px; border-radius: 15px; margin-top: 20px; font-weight: bold; cursor: pointer; }
        .day-off { display: flex; align-items: center; gap: 10px; margin-top: 5px; }
        .day-off input { width: auto; }
    </style>
</head>
<body>

    <div class="card">
        <h2>⚙️ إعدادات العيادة</h2>
        
        <label>صورة الطبيب (رابط URL)</label>
        <input type="text" id="dr-photo" placeholder="https://...">

        <div class="grid">
            <div>
                <label>وقت بدء العمل</label>
                <input type="time" id="start-time" value="15:00">
            </div>
            <div>
                <label>مدة الفترة (دقائق)</label>
                <select id="block-duration">
                    <option value="60">60 دقيقة</option>
                    <option value="90" selected>90 دقيقة</option>
                    <option value="120">120 دقيقة</option>
                </select>
            </div>
        </div>

        <div class="grid">
            <div>
                <label>عدد المرضى لكل فترة</label>
                <input type="number" id="patients-per-block" value="10">
            </div>
            <div>
                <label>عدد الفترات (Blocks)</label>
                <input type="number" id="total-blocks" value="4">
            </div>
        </div>

        <label>سعر الحجز VIP (دينار)</label>
        <input type="text" id="vip-price" value="50,000">

        <label>أيام العطلة الأسبوعية</label>
        <div class="day-off"><input type="checkbox" class="holiday" value="5" checked> الجمعة</div>
        <div class="day-off"><input type="checkbox" class="holiday" value="6"> السبت</div>

        <button class="btn-save" onclick="saveSettings()">حفظ الإعدادات</button>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyAWcgHZN1YNaoCYbw5_svArm-DOHwI735o",
            authDomain: "clinco-app.firebaseapp.com",
            projectId: "clinco-app",
            storageBucket: "clinco-app.firebasestorage.app",
            messagingSenderId: "293678509413",
            appId: "1:293678509413:web:7d8b9b77e57a68a215c58c"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        async function saveSettings() {
            const holidays = Array.from(document.querySelectorAll('.holiday:checked')).map(cb => parseInt(cb.value));
            
            const settings = {
                drPhoto: document.getElementById('dr-photo').value,
                startTime: document.getElementById('start-time').value,
                blockDuration: parseInt(document.getElementById('block-duration').value),
                patientsPerBlock: parseInt(document.getElementById('patients-per-block').value),
                totalBlocks: parseInt(document.getElementById('total-blocks').value),
                vipPrice: document.getElementById('vip-price').value,
                holidays: holidays
            };

            try {
                await db.collection("clinic_settings").doc("main_config").set(settings);
                alert("تم حفظ الإعدادات بنجاح!");
            } catch (e) { alert("خطأ في الحفظ"); }
        }
    </script>
</body>
</html>
