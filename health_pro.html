<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HealthCloud OS - حماية البيانات الطبية</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        :root { --navy: #0a192f; --blue: #0077b6; --gold: #ffc300; --bg: #f4f7fa; --locked: #64748b; }
        body { font-family: 'Segoe UI', sans-serif; margin: 0; background: var(--bg); direction: rtl; }
        nav { background: var(--navy); color: white; padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; }
        .brand { font-weight: 900; color: var(--gold); }
        .container { max-width: 1000px; margin: 20px auto; padding: 0 15px; }
        
        .record-item { background: white; padding: 20px; border-radius: 15px; margin-bottom: 10px; border-right: 5px solid var(--blue); box-shadow: 0 4px 10px rgba(0,0,0,0.03); position: relative; }
        .status-badge { font-size: 0.7rem; padding: 3px 8px; border-radius: 5px; float: left; font-weight: bold; }
        .status-locked { background: #f1f5f9; color: var(--locked); }
        .status-editable { background: #dcfce7; color: #166534; }
        
        .edit-btn { background: none; border: 1px solid var(--blue); color: var(--blue); padding: 5px 10px; border-radius: 5px; cursor: pointer; font-size: 0.8rem; margin-top: 10px; }
        
        /* MODAL STYLING */
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); z-index: 2000; backdrop-filter: blur(10px); overflow-y: auto; }
        .modal-content { background: white; width: 95%; max-width: 850px; margin: 20px auto; border-radius: 30px; overflow: hidden; }
        .modal-header { background: var(--navy); color: white; padding: 25px; text-align: center; }
        .tab-content { padding: 25px; display: none; }
        .tab-content.active { display: block; }
        .add-form { background: #f1f5f9; padding: 20px; border-radius: 20px; margin-top: 20px; border: 1px dashed var(--blue); }
        textarea { width: 100%; height: 70px; border-radius: 10px; border: 1px solid #ddd; padding: 10px; margin: 10px 0; box-sizing: border-box; }
        .btn-main { background: var(--blue); color: white; border: none; padding: 12px 25px; border-radius: 10px; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>

    <nav><div class="brand">HEALTHCLOUD INTEGRITY v3.0</div></nav>

    <div class="container">
        <h2>سجل الحالات الموثقة</h2>
        <div id="patientList"></div>
    </div>
<div id="passportModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <span onclick="closeModal()" style="float:left; cursor:pointer;">إغلاق ×</span>
                <h2 id="pNameTitle">اسم المريض</h2>
                <p>نظام السجلات غير القابلة للتلاعب</p>
            </div>

            <div id="medical" class="tab-content active">
                <div id="recordList"></div>
                
                <div class="add-form">
                    <label>إضافة سجل طبي جديد (متاح للتعديل لمدة 10 دقائق فقط):</label>
                    <textarea id="newNote" placeholder="اكتب الملاحظة الطبية هنا..."></textarea>
                    <button class="btn-main" onclick="saveRecord()">إضافة للسجل الدائم ➕</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Use your existing Firebase Config
        const firebaseConfig = {
            apiKey: "AIzaSyDqMEr5yKTjN3GV5osJmwW_2hdKVQOzFWs",
            authDomain: "dentalclinicbooking-system.firebaseapp.com",
            projectId: "dentalclinicbooking-system",
            storageBucket: "dentalclinicbooking-system.firebasestorage.app",
            messagingSenderId: "892853005967",
            appId: "1:892853005967:web:1a5fb182c073eba1ee0afa"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        let activePatient = "";

        function loadPatients() {
            db.collection("bookings").onSnapshot(snap => {
                const list = document.getElementById('patientList');
                list.innerHTML = "";
                snap.forEach(doc => {
                    const d = doc.data();
                    list.innerHTML += `<div class="record-item" onclick="openPassport('${d.name}')">
                        <strong>${d.name}</strong><br><small>📞 ${d.phone}</small>
                    </div>`;
                });
            });
        }

        async function openPassport(name) {
            activePatient = name;
            document.getElementById('pNameTitle').innerText = name;
            document.getElementById('passportModal').style.display = 'block';
            loadRecords();
        }

        async function loadRecords() {
            const snap = await db.collection("publicRecords").where("name", "==", activePatient).orderBy("timestamp", "desc").get();
            const container = document.getElementById('recordList');
            container.innerHTML = "";
            
            const now = new Date().getTime();
            snap.forEach(doc => {
                const d = doc.data();
                const entryTime = d.timestamp ? d.timestamp.toDate().getTime() : now;
                const diffMinutes = (now - entryTime) / (1000 * 60);
                
                // If less than 10 mins, show editable badge
                const isEditable = diffMinutes < 10;
                const statusClass = isEditable ? "status-editable" : "status-locked";
                const statusText = isEditable ? "قابل للتعديل" : "🔒 سجل دائم";

                container.innerHTML += `
                    <div class="record-item">
                        <span class="status-badge ${statusClass}">${statusText}</span>
                        <small>${d.date} | المصدر: ${d.facility}</small>
                        <div id="text_${doc.id}"><strong>${d.note}</strong></div>
                        ${isEditable ? `<button class="edit-btn" onclick="editRecord('${doc.id}', '${d.note}')">تعديل الخطأ ✏️</button>` : ''}
                    </div>`;
            });
        }

        function saveRecord() {
            const note = document.getElementById('newNote').value;
            if (!note) return;

            db.collection("publicRecords").add({
                name: activePatient,
                note: note,
                facility: "مستشفى كركوك العام",
                date: new Date().toLocaleDateString('ar-EG'),
                timestamp: firebase.firestore.FieldValue.serverTimestamp()
            }).then(() => {
                document.getElementById('newNote').value = "";
                loadRecords();
            });
        }

        function editRecord(id, oldNote) {
            const newNote = prompt("قم بتصحيح الخطأ:", oldNote);
            if (newNote && newNote !== oldNote) {
                db.collection("publicRecords").doc(id).update({
                    note: newNote + " (تم التعديل لتصحيح خطأ)",
                    editTimestamp: firebase.firestore.FieldValue.serverTimestamp()
                }).then(() => loadRecords());
            }
        }

        function closeModal() { document.getElementById('passportModal').style.display = 'none'; }
        loadPatients();
    </script>
</body>
</html>
