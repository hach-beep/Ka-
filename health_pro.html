<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الطبلة الإلكترونية - HealthCloud Pro</title>
    
    <!-- Libraries -->
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+Arabic:wght@300;500;700;900&display=swap');
        :root { --navy: #0a192f; --blue: #0077b6; --gold: #ffc300; --bg: #f4f7fa; }
        body { font-family: 'Noto Sans Arabic', sans-serif; margin: 0; background: var(--bg); direction: rtl; padding-bottom: 50px; }
        
        header { background: var(--navy); color: white; padding: 20px; text-align: center; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        .container { max-width: 800px; margin: 20px auto; padding: 0 15px; }
        header { background: var(--navy); color: white; padding: 20px; text-align: center; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        .container { max-width: 800px; margin: 20px auto; padding: 0 15px; }
        
        .section-card { background: white; border-radius: 20px; padding: 25px; margin-bottom: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.05); border: 1px solid #e2e8f0; }
        .section-title { font-weight: 900; color: var(--blue); border-right: 5px solid var(--gold); padding-right: 15px; margin-bottom: 20px; background: #f8fafc; padding: 10px; }

        .grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 15px; }
        .input-group { display: flex; flex-direction: column; gap: 5px; }
        label { font-size: 0.8rem; font-weight: bold; color: #64748b; }
        input, textarea, select { padding: 12px; border: 1px solid #e2e8f0; border-radius: 10px; font-size: 1rem; outline: none; }

        /* Table */
        table { width: 100%; border-collapse: collapse; margin-top: 15px; }
        th { background: var(--blue); color: white; padding: 10px; font-size: 0.8rem; text-align: right; }
        td { border: 1px solid #e2e8f0; padding: 10px; font-size: 0.9rem; }

        .btn-save { background: var(--blue); color: white; border: none; padding: 18px; border-radius: 15px; font-weight: bold; cursor: pointer; flex: 1; }
        .btn-add-note { background: #2a9d8f; color: white; border: none; padding: 10px 20px; border-radius: 8px; cursor: pointer; margin-top: 10px; }

        /* QR Modal */
        #qrModal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); z-index: 5000; text-align: center; color: white; padding-top: 50px; }
        #qrcode { background: white; padding: 20px; display: inline-block; border-radius: 20px; margin: 20px; }

        @media (max-width: 600px) { .grid { grid-template-columns: 1fr; } }
    </style>
</head>
<body>

    <header>
        <h1>الطبلة الطبية الرقمية</h1>
        <button onclick="window.location.href='registry.html'" style="background:none; border:1px solid white; color:white; padding:5px 10px; border-radius:8px; cursor:pointer;">العودة للسجل ←</button>
    </header>

    <div class="container">
        <!-- 1. PATIENT INFO -->
        <div class="section-card">
            <div class="section-title">👤 معلومات المريض</div>
            <div class="input-group">
                <label>الاسم الثلاثي</label>
                <input type="text" id="pName" placeholder="أدخل الاسم">
            </div>
        </div>
<!-- 2. MEDICAL HISTORY -->
        <div class="section-card">
            <div class="section-title">📋 التاريخ الطبي</div>
            <div class="input-group">
                <label>الشكوى الرئيسية</label>
                <input type="text" id="h_complaint">
            </div>
            <div class="input-group" style="margin-top:15px;">
                <label>تاريخ المرض الحالي</label>
                <textarea id="h_present"></textarea>
            </div>
            <div class="grid" style="margin-top:15px;">
                <div class="input-group"><label>الأمراض المزمنة</label><input type="text" id="h_chronic"></div>
                <div class="input-group"><label>الحساسية</label><input type="text" id="h_allergy" style="color:red;"></div>
                <div class="input-group"><label>فصيلة الدم</label><input type="text" id="h_blood"></div>
            </div>
        </div>

        <!-- 3. VITALS -->
        <div class="section-card">
            <div class="section-title">🌡️ العلامات الحيوية</div>
            <div class="grid">
                <div class="input-group"><label>ضغط الدم</label><input type="text" id="vBP"></div>
                <div class="input-group"><label>النبض</label><input type="text" id="vPulse"></div>
                <div class="input-group"><label>الحرارة</label><input type="text" id="vTemp"></div>
            </div>
        </div>

        <!-- 4. OBSERVATIONS -->
        <div class="section-card">
            <div class="section-title">✍️ سجل الملاحظات</div>
            <table>
                <thead><tr><th>الوقت</th><th>الملاحظة</th><th>حذف</th></tr></thead>
                <tbody id="obsBody"></tbody>
            </table>
            <div style="margin-top:15px; background:#f8fafc; padding:15px; border-radius:10px;">
                <textarea id="newNote" placeholder="اكتب الملاحظة هنا..."></textarea>
                <button class="btn-add-note" onclick="addNoteRow()">إضافة ملاحظة ➕</button>
            </div>
        </div>

        <!-- SAVE BUTTONS -->
        <div style="display:flex; gap:15px;">
            <button class="btn-save" id="subBtn" onclick="saveFullTableh('active')">حفظ التحديثات 💾</button>
            <button class="btn-save" style="background:#1e293b;" onclick="saveFullTableh('archived')">أرشفة وخروج 🔒</button>
        </div>
    </div>

    <!-- QR MODAL -->
    <div id="qrModal">
        <h2>✅ تم الحفظ بنجاح</h2>
        <p>الجواز الطبي الرقمي للمريض:</p>
        <div id="qrcode"></div><br>
        <button onclick="window.location.href='registry.html'" style="background:var(--gold); padding:15px 30px; border-radius:10px; border:none; font-weight:bold;">العودة للسجل</button>
    </div>
<script>
        const firebaseConfig = {
            apiKey: "AIzaSyDqMEr5yKTjN3GV5osJmwW_2hdKVQOzFWs",
            authDomain: "dentalclinicbooking-system.firebaseapp.com",
            projectId: "dentalclinicbooking-system",
            storageBucket: "dentalclinicbooking-system.firebasestorage.app",
            messagingSenderId: "892853005967",
            appId: "1:892853005967:web:1a5fb182c073eba1ee0afa"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        const urlParams = new URLSearchParams(window.location.search);
        const urlName = urlParams.get('name');
        const admissionId = urlParams.get('id'); 

        let notesArray = [];

        // 1. AUTO-LOAD DATA
        if (urlName) document.getElementById('pName').value = urlName;
        if (admissionId) {
            db.collection("hospitalTableh").doc(admissionId).get().then(doc => {
                const d = doc.data();
                document.getElementById('pName').value = d.patientName;
                document.getElementById('h_complaint').value = d.clinical.complaint;
                document.getElementById('h_present').value = d.clinical.history;
                document.getElementById('h_blood').value = d.clinical.bloodType || "";
                document.getElementById('h_allergy').value = d.clinical.allergy || "";
                document.getElementById('h_chronic').value = d.clinical.chronic || "";
                notesArray = d.observations || [];
                renderNotes();
            });
        }

        // 2. ADD NOTE TO TABLE
        function addNoteRow() {
            const text = document.getElementById('newNote').value;
            if(!text) return;
            notesArray.push({ time: new Date().toLocaleString('ar-EG'), text: text });
            renderNotes();
            document.getElementById('newNote').value = "";
        }

        function renderNotes() {
            const body = document.getElementById('obsBody');
            body.innerHTML = "";
            notesArray.forEach((n, i) => {
                body.innerHTML += `<tr><td>${n.time}</td><td>${n.text}</td><td><button onclick="deleteNoteRow(${i})" style="color:red; background:none; border:none; cursor:pointer;">🗑️</button></td></tr>`;
            });
        }

        function deleteNoteRow(i) { notesArray.splice(i, 1); renderNotes(); }
   // 3. THE MASTER SAVE LOGIC
        function saveFullTableh(status) {
            const name = document.getElementById('pName').value;
            if (!name) return alert("يرجى إدخال الاسم");

            const data = {
                patientName: name,
                status: status,
                clinical: {
                    complaint: document.getElementById('h_complaint').value,
                    history: document.getElementById('h_present').value,
                    bloodType: document.getElementById('h_blood').value,
                    allergy: document.getElementById('h_allergy').value,
                    chronic: document.getElementById('h_chronic').value
                },
                vitals: {
                    bp: document.getElementById('vBP').value,
                    pulse: document.getElementById('vPulse').value,
                    temp: document.getElementById('vTemp').value
                },
                observations: notesArray,
                timestamp: firebase.firestore.FieldValue.serverTimestamp()
            };

            if (admissionId) {
                db.collection("hospitalTableh").doc(admissionId).update(data).then(() => {
                    alert("✅ تم تحديث السجل بنجاح");
                    if(status === 'archived') window.location.href = "registry.html";
                });
            } else {
                db.collection("hospitalTableh").add(data).then((docRef) => {
                    document.getElementById('qrModal').style.display = 'block';
                    document.getElementById('qrcode').innerHTML = "";
                    const passportLink = `https://hach-beep.github.io/Ka-/emergency_id.html?name=${encodeURIComponent(name)}`;
                    new QRCode(document.getElementById("qrcode"), { text: passportLink, width: 200, height: 200 });
                });
            }
        }
    </script>
</body>
</html>
