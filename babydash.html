<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>سجل اللقاحات - BabyGuard</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>
    <style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+Arabic:wght@300;500;800&display=swap');

    :root {
        --teal: #2a9d8f;
        --blue: #00b4d8;
        --bg: #f8fafc;
        --white: #ffffff;
        --shadow: 0 10px 30px rgba(0,0,0,0.04);
    }

    body { 
        font-family: 'Noto Sans Arabic', sans-serif; 
        margin: 0; background-color: var(--bg); direction: rtl; 
        color: #1e293b; padding-bottom: 40px;
    }

    .container { max-width: 500px; margin: 0 auto; padding: 20px; }

    /* --- THE HERO CARD (Glassmorphism) --- */
    .baby-card { 
        background: linear-gradient(135deg, #2a9d8f 0%, #00b4d8 100%);
        padding: 40px 20px; border-radius: 35px; 
        text-align: center; margin-bottom: 30px; color: white;
        box-shadow: 0 20px 40px rgba(42, 157, 143, 0.2);
    }

    /* The Progress Ring */
    .circle { 
        width: 110px; height: 110px; border-radius: 50%; 
        border: 6px solid rgba(255,255,255,0.3);
        margin: 0 auto 15px auto; display: flex; 
        align-items: center; justify-content: center; 
        font-weight: 800; font-size: 1.5rem;
        background: rgba(255,255,255,0.1);
        backdrop-filter: blur(5px); /* Frosted glass effect */
    }
        

    /* --- VACCINE ITEMS --- */
    .vaccine-item { 
        background: var(--white); padding: 20px; border-radius: 24px; 
        margin-bottom: 15px; display: flex; justify-content: space-between; 
        align-items: center; box-shadow: var(--shadow);
        border: 1px solid rgba(0,0,0,0.02);
        transition: 0.3s ease;
    }

    .vaccine-item.done { 
        background: #f0fff4; border-right: 8px solid #90be6d; 
    }

    .vaccine-info strong { font-size: 1rem; color: #334155; }
    .vaccine-info small { color: #64748b; font-size: 0.8rem; display: block; margin-top: 4px; }

    /* --- BUTTONS --- */
    .btn-check { 
        background-color: var(--teal); color: white; border: none; 
        padding: 12px 20px; border-radius: 14px; font-weight: 700; 
        cursor: pointer; transition: 0.2s;
    }

    .btn-check:active { transform: scale(0.95); }

    .share-btn {
        background: #25D366; color: white; border: none;
        padding: 18px; border-radius: 20px; width: 100%;
        font-weight: 800; font-size: 1.1rem; margin-top: 20px;
        box-shadow: 0 10px 20px rgba(37, 211, 102, 0.2);
    }

    /* Parent Mode Invisibility */
    .parent-mode .nurse-only { display: none !important; }
    </style>
</head>
<body id="mainBody">
    <div style="padding: 10px 20px; text-align: left;">
        <button onclick="location.href='index.html'" style="background:none; border:1px solid #2a9d8f; color:#2a9d8f; padding:5px 15px; border-radius:8px; cursor:pointer; font-weight:bold;">الرئيسية Home</button>
    </div>
    <div class="container">
        <div class="baby-card">
            <h1 id="babyName">جاري التحميل...</h1>
            <div class="circle" id="percent">0%</div>
            <p style="color:#64748b;">نسبة الحماية المكتملة</p>
            <button class="nurse-only" onclick="shareWithMom()" style="background:#25D366; color:white; border:none; padding:10px; border-radius:10px; width:100%; font-weight:bold; margin-top:10px;">إرسال الرابط للأم 💬</button>
        </div>
        <div id="list"></div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyAX35fTT2-D9OQgKQkzgNJCQTtcN0S2LwQ",
            authDomain: "babyguard-system.firebaseapp.com",
            projectId: "babyguard-system",
            storageBucket: "babyguard-system.firebasestorage.app",
            messagingSenderId: "892853005967",
            appId: "1:892853005967:web:1a5fb182c073eba1ee0afa"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        const params = new URLSearchParams(window.location.search);
        const id = params.get('id');
        if(params.get('view') === 'parent') document.body.classList.add('parent-mode');

        const schedule = [
            { name: "Hepatitis B (0)", days: 0 },
            { name: "BCG, OPV (0)", days: 7 },
            { name: "Penta 1, Rota 1, PCV 1", days: 60 },
            { name: "Penta 2, Rota 2, PCV 2, IPV 1", days: 120 },
            { name: "Penta 3, Rota 3, PCV 3, IPV 2", days: 180 },
            { name: "Measles, Vit A", days: 270 },
            { name: "MMR (1)", days: 365 },
            { name: "DPT B1, OPV B1, MMR 2", days: 545 }
        ];

        if(id) {
            db.collection("babies").doc(id).onSnapshot(doc => {
                const data = doc.data();
                document.getElementById('babyName').innerText = data.name;
                const doneList = data.completed || [];
                renderList(data.dob, doneList);
                const progress = Math.round((doneList.length / schedule.length) * 100);
                document.getElementById('percent').innerText = progress + "%";
            });
        }

        function renderList(dobStr, doneList) {
            const listDiv = document.getElementById('list');
            listDiv.innerHTML = "";
            const dob = new Date(dobStr);

            schedule.forEach((item, index) => {
                const target = new Date(dob);
                target.setDate(target.getDate() + item.days);
                const isDone = doneList.includes(index);

                listDiv.innerHTML += `
                <div class="vaccine-item ${isDone ? 'done' : ''}">
                    <div>
                        <strong>${item.name}</strong><br>
                        <small>${isDone ? '✅ تم التلقيح' : '⏳ الموعد: ' + target.toLocaleDateString('ar-EG')}</small>
                    </div>
                    <button class="btn-check nurse-only" onclick="markDone(${index})" ${isDone ? 'disabled' : ''}>
                        ${isDone ? 'تم' : 'تأكيد 💉'}
                    </button>
                </div>`;
        });
    }

    function markDone(index) {
        db.collection("babies").doc(id).update({
            completed: firebase.firestore.FieldValue.arrayUnion(index)
        });
    }

    function shareWithMom() {
        const url = "https://hach-beep.github.io/Ka-/babydash.html?id=" + id + "&view=parent";
        window.open("https://wa.me/?text=" + encodeURIComponent("رابط متابعة لقاحات طفلك: " + url));
    }
    </script>
</body>
</html>
