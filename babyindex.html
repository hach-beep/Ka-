<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BabyGuard - المنظومة الوطنية</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Arabic:wght@300;500;800&display=swap" rel="stylesheet">
    <style>
        :root { --navy: #0a192f; --teal: #2a9d8f; --gold: #ffc300; --bg: #f8fafc; }
        body { font-family: 'Noto Sans Arabic', sans-serif; margin: 0; background: var(--bg); color: var(--navy); }
        
        /* CINEMATIC HERO SECTION */
        .hero {
            background: linear-gradient(rgba(10, 25, 47, 0.7), rgba(10, 25, 47, 0.7)), 
                        url('https://images.unsplash.com/photo-1584132967334-10e028bd69f7?auto=format&fit=crop&q=80&w=1200');
            background-size: cover; background-position: center;
            height: 100vh; display: flex; align-items: center; justify-content: center; text-align: center; color: white;
        }

        .hero-content h1 { font-size: 3.5rem; color: var(--gold); margin: 0; font-weight: 900; }
        .hero-content p { font-size: 1.4rem; opacity: 0.9; margin: 20px 0 40px; max-width: 700px; line-height: 1.8; }

        .btn-group { display: flex; gap: 20px; justify-content: center; flex-wrap: wrap; }
        .btn { 
            padding: 20px 45px; border-radius: 20px; font-weight: 800; font-size: 1.2rem; 
            text-decoration: none; transition: 0.3s; box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            display: inline-block;
        }
        .btn-primary { background: var(--gold); color: var(--navy); }
        .btn-secondary { background: white; color: var(--navy); }
        .btn:hover { transform: translateY(-5px); filter: brightness(1.1); }
    </style>
</head>
<body>
    <section class="hero">
        <div class="hero-content">
            <h1>BabyGuard 🤱🏻🛡️</h1>
            <p>The Digital System for Tracking Child Vaccinations. Ensuring every child in the city is protected, one dose at a time.</p>
            <div class="btn-group">
                <a href="babyreg.html" class="btn-primary">Register New Baby </a>
                <a href="babylist.html" class="btn-secondary">Enter Master Registry</a>
            </div>
        </div>
    </section>
</body>
</html>
