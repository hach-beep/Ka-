<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Private Medical Glass UI</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --navy: #013061;
            --sky-blue: #93CAFF;
            --ice-blue: #EEFCFF;
            --slate-gray: #64748B;
            --white: #FFFFFF;
            --glass-bg: rgba(255, 255, 255, 0.7);
            --glass-border: rgba(255, 255, 255, 0.4);
        }

        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            font-family: 'Inter', -apple-system, sans-serif;
            background-color: var(--ice-blue);
            overflow: hidden; /* Prevents double scroll with the panel */
        }

        /* --- THE WAVE HEADER --- */
        .header {
            background-color: var(--navy);
            height: 35vh;
            padding: 40px 25px;
            color: white;
            position: relative;
        }

        .profile-header {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .avatar-glow {
            width: 50px;
            height: 50px;
            border-radius: 15px;
            background: linear-gradient(135deg, var(--sky-blue), #fff);
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--navy);
            font-weight: bold;
            box-shadow: 0 0 20px rgba(147, 202, 255, 0.4);
        }

        .wave-svg {
            position: absolute;
            bottom: -2px;
            left: 0;
            width: 100%;
            height: 100px;
        }

        /* --- GRID BLOCKS --- */
        .container {
            padding: 0 20px;
            margin-top: -30px;
            position: relative;
            z-index: 10;
        }

        .grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .block {
            background: var(--white);
            border-radius: 24px;
            padding: 20px;
            height: 140px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            box-shadow: 0 10px 30px rgba(1, 48, 97, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.8);
            cursor: pointer;
        }

        .block i { font-size: 1.5rem; color: var(--navy); }
        .block span { font-weight: 700; font-size: 0.9rem; color: var(--navy); }

        /* --- GLASSMORPHISM PANEL --- */
        .glass-panel {
            position: fixed;
            bottom: -100%; /* Hidden by default */
            left: 0;
            width: 100%;
            height: 75%; /* 2/3 of the page as per your sketch */
            
            /* The Glass Effect */
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            
            border-top: 1px solid var(--glass-border);
            border-top-left-radius: 40px;
            border-top-right-radius: 40px;
            box-shadow: 0 -10px 40px rgba(0, 0, 0, 0.1);
            
            transition: all 0.6s cubic-bezier(0.32, 0, 0.07, 1);
            z-index: 1000;
            padding: 30px;
        }

        .glass-panel.active {
            bottom: 0;
        }

        .handle {
            width: 40px;
            height: 5px;
            background: rgba(1, 48, 97, 0.2);
            border-radius: 10px;
            margin: -10px auto 30px;
        }

        /* --- TIME BLOCKS (Inside Panel) --- */
        .time-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-top: 20px;
        }

        .time-chip {
            padding: 12px;
            background: rgba(255, 255, 255, 0.5);
            border: 1px solid var(--glass-border);
            border-radius: 12px;
            text-align: center;
            font-size: 0.8rem;
            font-weight: 600;
            color: var(--navy);
        }

        .holiday-banner {
            background: rgba(248, 113, 113, 0.1);
            border: 1px solid rgba(248, 113, 113, 0.2);
            padding: 15px;
            border-radius: 15px;
            color: #b91c1c;
            font-size: 0.85rem;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        /* Background Overlay when panel is open */
        .overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(1, 48, 97, 0.3);
            display: none;
            z-index: 999;
        }
        .overlay.active { display: block; }

    </style>
</head>
<body>

    <div class="header">
        <div class="profile-header">
            <div class="avatar-glow">JD</div>
            <div>
                <h2 style="margin:0; font-size: 1.1rem;">Dr. John Doe</h2>
                <p style="margin:0; font-size: 0.8rem; opacity: 0.7;">Private Practice Admin</p>
            </div>
        </div>

        <svg class="wave-svg" viewBox="0 0 500 150" preserveAspectRatio="none">
            <path d="M0,150 C150,150 280,0 500,150 L500,150 L0,150 Z" fill="var(--ice-blue)"></path>
        </svg>
    </div>

    <div class="container">
        <div class="grid">
            <div class="block" onclick="openGlassPanel('Schedule Settings')">
                <i class="fa-solid fa-calendar-alt"></i>
                <span>Clinic<br>Holidays</span>
            </div>
            <div class="block" onclick="openGlassPanel('Patient List')">
                <i class="fa-solid fa-users"></i>
                <span>Private<br>Patients</span>
            </div>
            <div class="block" onclick="openGlassPanel('Availability')">
                <i class="fa-solid fa-clock"></i>
                <span>Booking<br>Hours</span>
            </div>
            <div class="block" onclick="openGlassPanel('Security')">
                <i class="fa-solid fa-fingerprint"></i>
                <span>App<br>Security</span>
            </div>
        </div>
    </div>

    <!-- The Overlay -->
    <div id="overlay" class="overlay" onclick="closeGlassPanel()"></div>

    <!-- The Glassmorphism Panel -->
    <div id="glassPanel" class="glass-panel">
        <div class="handle"></div>
        <h2 id="panelTitle" style="color: var(--navy); margin-bottom: 5px;">Settings</h2>
        <p style="color: var(--slate-gray); font-size: 0.9rem; margin-bottom: 30px;">Manage your clinic preferences</p>

        <div class="holiday-banner">
            <i class="fa-solid fa-circle-exclamation"></i>
            <span>Clinic will be closed for <b>Eid/National Holiday</b></span>
        </div>

        <label style="font-weight: 700; font-size: 0.8rem; color: var(--navy);">AUTOMATIC TIME BLOCKS</label>
        <div class="time-grid">
            <div class="time-chip">09:00 AM</div>
            <div class="time-chip">10:00 AM</div>
            <div class="time-chip">11:00 AM</div>
            <div class="time-chip" style="opacity: 0.3;">12:00 PM</div> <!-- Holiday/Unclickable -->
            <div class="time-chip">01:00 PM</div>
            <div class="time-chip">02:00 PM</div>
        </div>

        <button onclick="closeGlassPanel()" style="width: 100%; margin-top: 50px; padding: 18px; border-radius: 20px; border: none; background: var(--navy); color: white; font-weight: bold; box-shadow: 0 10px 20px rgba(1, 48, 97, 0.2);">
            Update Schedule
        </button>
    </div>

    <script>
        function openGlassPanel(title) {
            document.getElementById('panelTitle').innerText = title;
            document.getElementById('glassPanel').classList.add('active');
            document.getElementById('overlay').classList.add('active');
        }

        function closeGlassPanel() {
            document.getElementById('glassPanel').classList.remove('active');
            document.getElementById('overlay').classList.remove('active');
        }
    </script>

</body>
</html>
