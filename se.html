<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>Clinco - إعدادات العيادة</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

    <style>
        :root { --primary: #5b8dfa; --bg: #f4f7f9; }
        body { font-family: sans-serif; background: var(--bg); padding: 20px; }
        .card { background: white; padding: 25px; border-radius: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); max-width: 500px; margin: auto; }
        h2 { color: var(--primary); border-bottom: 2px solid #eee; padding-bottom: 10px; }
        label { display: block; margin-top: 15px; font-weight: bold; font-size: 0.9rem; color: #555; }
        input, select { width: 100%; padding: 12px; margin-top: 5px; border: 1px solid #ddd; border-radius: 10px; box-sizing: border-box; }
        .row { display: flex; gap: 10px; }
        .btn-save { background: var(--primary); color: white; border: none; width: 100%; padding: 15px; border-radius: 12px; margin-top: 25px; font-weight: bold; cursor: pointer; }
        .holiday-chip { display: inline-block; padding: 5px 10px; background: #eee; border-radius: 20px; margin: 5px; cursor: pointer; font-size: 0.8rem; }
        .holiday-chip.active { background: #e74c3c; color: white; }
    </style>
</head>
<body>

    <div class="card">
        <h2>⚙️ إعدادات العيادة</h2>
        
        <label>صورة الطبيب (URL)</label>
        <input type="text" id="dr-photo" placeholder="ضع رابط الصورة هنا">

        <div class="row">
            <div style="flex:1">
                <label>وقت بدء العيادة</label>
                <input type="time" id="start-time">
            </div>
            <div style="flex:1">
                <label>سعر الـ VIP (دينار)</label>
                <input type="number" id="vip-price" placeholder="مثلاً 50,000">
            </div>
        </div>

        <div class="row">
            <div style="flex:1">
                <label>عدد المرضى لكل بلوك</label>
                <input type="number" id="block-capacity" value="10">
            </div>
            <div style="flex:1">
                <label>مدة البلوك (بالدقائق)</label>
                <input type="number" id="block-duration" value="60">
            </div>
        </div>

        <label>أيام العطلة (لن تظهر للمرضى)</label>
        <div id="holidays">
            <span class="holiday-chip" onclick="toggleHoliday(5, this)">الجمعة</span>
            <span class="holiday-chip" onclick="toggleHoliday(6, this)">السبت</span>
            <span class="holiday-chip" onclick="toggleHoliday(0, this)">الأحد</span>
        </div>

        <button class="btn-save" onclick="saveSettings()">حفظ الإعدادات</button>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyAWcgHZN1YNaoCYbw5_svArm-DOHwI735o",
            authDomain: "clinco-app.firebaseapp.com",
            projectId: "clinco-app",
            storageBucket: "clinco-app.firebasestorage.app",
            messagingSenderId: "293678509413",
            appId: "1:293678509413:web:7d8b9b77e57a68a215c58c"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        let offDays = [5]; // Friday by default

        function toggleHoliday(day, el) {
            if(offDays.includes(day)) {
                offDays = offDays.filter(d => d !== day);
                el.classList.remove('active');
            } else {
                offDays.push(day);
                el.classList.add('active');
            }
        }

        async function saveSettings() {
            const settings = {
                photo: document.getElementById('dr-photo').value,
                startTime: document.getElementById('start-time').value,
                vipPrice: document.getElementById('vip-price').value,
                capacity: document.getElementById('block-capacity').value,
                duration: document.getElementById('block-duration').value,
                offDays: offDays
            };

            try {
                // Save to a special document in Firebase
                await db.collection("clinic_settings").doc("main_config").set(settings);
                alert("تم حفظ الإعدادات بنجاح!");
            } catch (e) { alert("خطأ في الحفظ"); }
        }

        // Load existing settings on page open
        window.onload = async () => {
            const doc = await db.collection("clinic_settings").doc("main_config").get();
            if(doc.exists) {
                const s = doc.data();
                document.getElementById('dr-photo').value = s.photo || "";
                document.getElementById('start-time').value = s.startTime || "";
                document.getElementById('vip-price').value = s.vipPrice || "";
                document.getElementById('block-capacity').value = s.capacity || 10;
                document.getElementById('block-duration').value = s.duration || 60;
                // Update offDays UI...
            }
        }
    </script>
</body>
</html>
