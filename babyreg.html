<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل طفل - BabyGuard</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+Arabic:wght@400;700&display=swap');
        body { font-family: 'Noto Sans Arabic', sans-serif; background-color: #f0f9ff; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .card { background: white; padding: 40px; border-radius: 30px; box-shadow: 0 10px 30px rgba(0,0,0,0.05); width: 90%; max-width: 400px; text-align: center; }
        input, select { width: 100%; padding: 15px; margin: 10px 0; border: 1px solid #e2e8f0; border-radius: 12px; box-sizing: border-box; font-size: 1rem; }
        button { background: #2a9d8f; color: white; border: none; padding: 18px; width: 100%; border-radius: 12px; font-weight: bold; cursor: pointer; margin-top: 20px; }
    </style>
</head>
<body>
    <div class="card">
        <h2 style="color:#005f8d;">تسجيل طفل جديد 👶</h2>
        <input type="text" id="name" placeholder="الاسم الثلاثي للطفل">
        <input type="date" id="dob">
        <input type="tel" id="phone" placeholder="رقم هاتف الأم">
        <button id="regBtn" onclick="saveBaby()">حفظ وفتح السجل 💾</button>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyAX35fTT2-D9OQgKQkzgNJCQTtcN0S2LwQ",
            authDomain: "babyguard-system.firebaseapp.com",
            projectId: "babyguard-system",
            storageBucket: "babyguard-system.firebasestorage.app",
            messagingSenderId: "834481617596",
            appId: "1:834481617596:web:868391d8b73a5feabc6eb9"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        function saveBaby() {
            const n = document.getElementById('name').value;
            const d = document.getElementById('dob').value;
            const p = document.getElementById('phone').value;
            if(!n || !d) return alert("يرجى ملء البيانات");

            document.getElementById('regBtn').innerText = "جاري الحفظ...";
            db.collection("babies").add({ name: n, dob: d, phone: p, completed: [] })
            .then(docRef => { window.location.href = `baby_dash.html?id=${docRef.id}`; });
        }
    </script>
</body>
</html
