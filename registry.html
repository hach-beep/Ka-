<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>سجل المرضى الوطني - HealthCloud Pro</title>
    
    <!-- Libraries -->
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+Arabic:wght@300;500;700;900&display=swap');
        :root { --navy: #0a192f; --blue: #0077b6; --gold: #ffc300; --bg: #f4f7fa; }
        
        body { font-family: 'Noto Sans Arabic', sans-serif; margin: 0; background: var(--bg); direction: rtl; }
        
        /* Header */
        header { background: var(--navy); color: white; padding: 20px 40px; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 4px 15px rgba(0,0,0,0.2); }
        .btn-new { background: var(--gold); color: var(--navy); border: none; padding: 12px 25px; border-radius: 12px; font-weight: 900; cursor: pointer; }

        /* Search & Stats */
        .container { max-width: 1100px; margin: 30px auto; padding: 0 20px; }
        .top-row { display: flex; gap: 20px; margin-bottom: 25px; align-items: center; }
        .search-box { flex: 1; background: white; padding: 15px; border-radius: 15px; display: flex; align-items: center; gap: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.02); }
        .search-box input { border: none; outline: none; width: 100%; font-size: 1rem; background: transparent; }

        /* Table Style */
        .card { background: white; border-radius: 25px; box-shadow: 0 20px 50px rgba(0,0,0,0.05); overflow: hidden; }
        table { width: 100%; border-collapse: collapse; }
        th { background: #f8fafc; padding: 20px; text-align: right; color: #64748b; font-size: 0.8rem; }
        td { padding: 20px; border-bottom: 1px solid #f1f5f9; vertical-align: middle; }
        
        .qr-cell { width: 60px; height: 60px; background: #f8fafc; border-radius: 8px; padding: 5px; }
        .patient-name { font-weight: 800; color: var(--navy); cursor: pointer; font-size: 1.1rem; }
        .patient-name:hover { color: var(--blue); text-decoration: underline; }
      /* Modal */
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); z-index: 2000; backdrop-filter: blur(10px); overflow-y: auto; }
        .modal-content { background: white; width: 95%; max-width: 600px; margin: 40px auto; border-radius: 30px; padding: 30px; }
        input, select, textarea { width: 100%; padding: 12px; margin: 10px 0; border-radius: 10px; border: 1px solid #ddd; box-sizing: border-box; }
        .btn-save { background: var(--navy); color: white; border: none; padding: 15px; width: 100%; border-radius: 12px; font-weight: bold; cursor: pointer; margin-top: 10px; }
    </style>
</head>
<body>

    <header>
        <div style="font-weight: 900; font-size: 1.4rem; color: var(--gold);">HEALTHCLOUD REGISTRY</div>
        <button class="btn-new" onclick="openRegModal()">+ تسجيل مريض جديد</button>
    </header>

    <div class="container">
        <div class="top-row">
            <div class="search-box">
                <span>🔍</span>
                <input type="text" id="searchBar" onkeyup="filterTable()" placeholder="ابحث عن مريض بالاسم أو الرقم الوطني...">
            </div>
        </div>

        <div class="card">
            <table>
                <thead>
                    <tr>
                        <th>الرمز (QR)</th>
                        <th>اسم المريض الثلاثي</th>
                        <th>رقم الهاتف</th>
                        <th>فصيلة الدم</th>
                        <th>إجراء</th>
                    </tr>
                </thead>
                <tbody id="registryBody">
                    <tr><td colspan="5" style="text-align:center; padding:50px;">جاري تحميل السجل الوطني...</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <!-- REGISTRATION MODAL -->
    <div id="regModal" class="modal">
        <div class="modal-content">
            <span onclick="closeModal()" style="float:left; cursor:pointer;">إغلاق ×</span>
            <h2 style="color:var(--navy);">تسجيل مريض جديد</h2>
            <label>الاسم الثلاثي واللقب:</label>
            <input type="text" id="regName">
            <label>رقم الهاتف:</label>
            <input type="tel" id="regPhone">
            <label>فصيلة الدم:</label>
            <select id="regBlood">
                <option>A+</option><option>A-</option><option>B+</option><option>B-</option>
                <option>O+</option><option>O-</option><option>AB+</option><option>AB-</option>
            </select>
            <label>تاريخ الميلاد:</label>
            <input type="date" id="regDob">
            <button class="btn-save" onclick="saveNewPatient()">إنشاء ملف دائم 💾</button>
        </div>
    </div>

    <script>
        // YOUR FIREBASE CONFIG
        const firebaseConfig = {
            apiKey: "AIzaSyDqMEr5yKTjN3GV5osJmwW_2hdKVQOzFWs",
            authDomain: "dentalclinicbooking-system.firebaseapp.com",
            projectId: "dentalclinicbooking-system",
            storageBucket: "dentalclinicbooking-system.firebasestorage.app",
            messagingSenderId: "892853005967",
            appId: "1:892853005967:web:1a5fb182c073eba1ee0afa"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        // LOAD REGISTRY
        function loadRegistry() {
            db.collection("patients").onSnapshot(snap => {
                const body = document.getElementById('registryBody');
                body.innerHTML = "";
                snap.forEach(doc => {
                    const d = doc.data();
                    const qrId = "qr_" + doc.id.replace(/\s/g, '');
                    
                    body.innerHTML += `
                        <tr>
                            <td><div id="${qrId}" class="qr-cell"></div></td>
                            <td><span class="patient-name" onclick="goToPatient('${d.name}')">${d.name}</span></td>
                            <td>${d.phone}</td>
                            <td><span style="color:red; font-weight:bold;">${d.bloodType}</span></td>
                            <td><button onclick="addAdmission('${d.name}')" style="border:1px solid var(--blue); background:none; color:var(--blue); padding:5px 10px; border-radius:8px; cursor:pointer;">دخول جديد +</button></td>
                        </tr>
                    `;
                    
                    // Generate QR for the table
                    setTimeout(() => {
                        new QRCode(document.getElementById(qrId), {
                            text: `https://hach-beep.github.io/Ka-/emergency_id.html?name=${encodeURIComponent(d.name)}`,
                            width: 50, height: 50
                        });
                    }, 100);
                });
            });
        }

        function saveNewPatient() {
            const name = document.getElementById('regName').value;
            const phone = document.getElementById('regPhone').value;
            const blood = document.getElementById('regBlood').value;
            const dob = document.getElementById('regDob').value;
          if(!name || !phone) return alert("يرجى ملء البيانات الأساسية");

            db.collection("patients").doc(name).set({
                name, phone, bloodType: blood, dob, timestamp: firebase.firestore.FieldValue.serverTimestamp()
            }).then(() => {
                alert("تم إنشاء الملف الطبي الدائم");
                closeModal();
            });
        }

        function goToPatient(name) {
            // Redirect to the Emergency ID / Brief view
            window.location.href = `emergency_id.html?name=${encodeURIComponent(name)}`;
        }

        function addAdmission(name) {
            // Redirect to the Tableh (Documentation) page
            window.location.href = `health_pro.html?name=${encodeURIComponent(name)}`;
        }

        function filterTable() {
            let val = document.getElementById('searchBar').value.toLowerCase();
            let rows = document.getElementById('registryBody').rows;
            for (let row of rows) { row.style.display = row.innerText.toLowerCase().includes(val) ? "" : "none"; }
        }

        function openRegModal() { document.getElementById('regModal').style.display = 'block'; }
        function closeModal() { document.getElementById('regModal').style.display = 'none'; }
        
        loadRegistry();
    </script>
</body>
</html>
