<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة التحكم - عيادة د. محمد برهان</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background-color: #f0f4f8; margin: 0; direction: rtl; padding: 20px; }
        header { background: #003459; color: white; padding: 20px; text-align: center; border-radius: 15px; margin-bottom: 20px; }
        .card { background: white; padding: 20px; border-radius: 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.05); }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th { background: #f8fafc; text-align: right; padding: 15px; color: #64748b; }
        td { padding: 15px; border-bottom: 1px solid #f1f5f9; }
        .btn-delete { background: #fee2e2; color: #ef4444; border: none; padding: 8px 15px; border-radius: 8px; cursor: pointer; font-weight: bold; }
        .tag { background: #e0f2fe; color: #0077b6; padding: 4px 10px; border-radius: 20px; font-size: 0.8rem; font-weight: bold; }
    </style>
</head>
<body>
    <header><h1>جدول مواعيد العيادة 🦷</h1></header>
    <div class="card">
        <table>
            <thead><tr><th>المريض</th><th>التاريخ</th><th>الوقت</th><th>السبب</th><th>إجراء</th></tr></thead>
            <tbody id="tableBody"></tbody>
        </table>
    </div>
    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyDqMEr5yKTjN3GV5osJmwW_2hdKVQOzFWs",
            authDomain: "dentalclinicbooking-system.firebaseapp.com",
            projectId: "dentalclinicbooking-system",
            storageBucket: "dentalclinicbooking-system.firebasestorage.app",
            messagingSenderId: "892853005967",
            appId: "1:892853005967:web:1a5fb182c073eba1ee0afa"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        db.collection("bookings").orderBy("date").onSnapshot((querySnapshot) => {
            const tableBody = document.getElementById('tableBody');
            tableBody.innerHTML = "";
            querySnapshot.forEach((doc) => {
                const data = doc.data();
                tableBody.innerHTML += `<tr><td>${data.name}</td><td>${data.date}</td><td>${data.time}</td><td><span class="tag">${data.reason}</span></td><td><button class="btn-delete" onclick="deleteBooking('${doc.id}')">إلغاء</button></td></tr>`;
                </tr>`;
            });
        });

        function deleteBooking(id) {
            if (confirm("هل أنت متأكد؟")) { db.collection("bookings").doc(id).delete(); }
        }
    </script>
</body>
</html>
