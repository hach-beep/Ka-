<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة التحكم - عيادة د. محمد برهان</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background-color: #f0f4f8; margin: 0; direction: rtl; padding: 20px; }
        header { background: #003459; color: blue; padding: 20px; text-align: center; border-radius: 15px; margin-bottom: 20px; display: flex; align-items: center; justify-content: space-around; }
        .logo-small { width: 50px; height: 50px; border-radius: 50%; border: 2px solid white; }
        
        .card { background: white; padding: 20px; border-radius: 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.05); }
        h2 { color: #003459; border-bottom: 2px solid #eef2f3; padding-bottom: 10px; }
        
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th { background: #f8fafc; text-align: right; padding: 15px; color: #64748b; font-size: 0.9rem; }
        td { padding: 15px; border-bottom: 1px solid #f1f5f9; font-size: 1rem; color: #1e293b; }
        
        .btn-delete { background: #fee2e2; color: #ef4444; border: none; padding: 8px 15px; border-radius: 8px; cursor: pointer; font-weight: bold; }
        .btn-delete:hover { background: #ef4444; color: white; }
        
        .tag { background: #e0f2fe; color: #0077b6; padding: 4px 10px; border-radius: 20px; font-size: 0.8rem; font-weight: bold; }
    </style>
</head>
<body>
<header>
        <img src="IMG_20260203_233626_888~2.jpg" class="logo-small">
        <h1>جدول مواعيد العيادة</h1>
        <button onclick="location.reload()" style="background: blue; border:1px solid white; color:white; border-radius:8px; padding:5px 10px; cursor:pointer;">تحديث 🔄</button>
    </header>

    <div class="card">
        <h2>المواعيد القادمة</h2>
        <table>
            <thead>
                <tr>
                    <th>اسم المريض</th>
                    <th>التاريخ</th>
                    <th>الوقت</th>
                    <th>السبب</th>
                    <th>إجراء</th>
                </tr>
            </thead>
            <tbody id="tableBody">
                <tr><td colspan="5" style="text-align:center;">جاري تحميل المواعيد...</td></tr>
            </tbody>
        </table>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyDqMEr5yKTjN3GV5osJmwW_2hdKVQOzFWs",
            authDomain: "dentalclinicbooking-system.firebaseapp.com",
            projectId: "dentalclinicbooking-system",
            storageBucket: "dentalclinicbooking-system.firebasestorage.app",
            messagingSenderId: "892853005967",
            appId: "1:892853005967:web:1a5fb182c073eba1ee0afa"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        // FETCH AND DISPLAY DATA
        function loadBookings() {
            db.collection("bookings").orderBy("date").onSnapshot((querySnapshot) => {
                const tableBody = document.getElementById('tableBody');
                tableBody.innerHTML = "";
                querySnapshot.forEach((doc) => {
                    const data = doc.data();
                    const row = `
                        <tr>
                            <td><strong>${data.name}</strong></td>
                            <td>${data.date}</td>
                            <td>${data.time}</td>
                            <td><span class="tag">${data.reason}</span></td>
                            <td><button class="btn-delete" onclick="deleteBooking('${doc.id}')">إلغاء</button></td>
                        </tr>
                    `;
                    tableBody.innerHTML += row;
                });
                
                if (querySnapshot.empty) {
                    tableBody.innerHTML = "<tr><td colspan='5' style='text-align:center;'>لا توجد مواعيد محجوزة حالياً</td></tr>";
                }
            });
        }

        // DELETE FUNCTION
        function deleteBooking(id) {
            if (confirm("هل أنت متأكد من إلغاء هذا الموعد؟")) {
                db.collection("bookings").doc(id).delete();
            }
        }

        loadBookings();
    </script>
</body>
</html>
