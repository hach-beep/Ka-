<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>حجز موعد - عيادة د. محمد برهان</title>
    <style>
        :root { --primary: #0077b6; --gradient: linear-gradient(135deg, #00b4db 0%, #0083b0 100%); }
        body { font-family: 'Segoe UI', sans-serif; margin: 0; background-color: #f4f7f9; direction: rtl; }
        
        /* MODERN HERO BOX (Pinterest Style) */
        .hero-box {
            background: var(--gradient);
            padding: 40px 20px;
            color: white;
            text-align: right;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .hero-content {
            display: flex;
            align-items: center;
            gap: 30px;
            max-width: 700px;
            width: 100%;
        }

        .profile-pic {
            width: 130px; /* Bigger photo */
            height: 130px;
            border-radius: 50%;
            border: 5px solid rgba(255,255,255,0.3);
            object-fit: cover;
            box-shadow: 0 8px 20px rgba(0,0,0,0.2);
        }

        .hero-text h1 { margin: 0; font-size: 2rem; font-weight: 800; }
        .hero-text .slogan { font-size: 1.2rem; margin-top: 5px; opacity: 0.9; font-style: italic; color: #e0f2fe; }

        /* FORM CONTAINER */
        .container { max-width: 550px; margin: -30px auto 40px auto; background: white; padding: 30px; border-radius: 25px; box-shadow: 0 15px 40px rgba(0,0,0,0.1); }
        
        .info-strip { text-align: center; color: var(--primary); font-weight: bold; margin-bottom: 25px; font-size: 0.9rem; }
        
        label { display: block; margin: 20px 0 8px; font-weight: bold; color: #333; }
        input, select { width: 100%; padding: 14px; border: 1px solid #e2e8f0; border-radius: 12px; font-size: 1rem; box-sizing: border-box; background: #fbfcfd; }
        
        /* TIME GRID */
        .time-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; margin-top: 10px; }
        .time-btn { padding: 12px; border: 1px solid var(--primary); color: var(--primary); border-radius: 10px; cursor: pointer; font-weight: bold; font-size: 0.85rem; text-align: center; }
        .time-btn.booked { background: #f1f5f9; border-color: #cbd5e1; color: #94a3b8; cursor: not-allowed; text-decoration: line-through; opacity: 0.6; }
        .time-btn.selected { background: var(--primary); color: white; }

        .btn-main { background: var(--primary); color: white; border: none; padding: 18px; width: 100%; border-radius: 15px; font-size: 1.2rem; font-weight: bold; cursor: pointer; margin-top: 30px; box-shadow: 0 10px 20px rgba(0, 119, 182, 0.2); }
        .btn-main:disabled { background: #cbd5e1; box-shadow: none; cursor: not-allowed; }

        @media (max-width: 500px) {
            .hero-content { flex-direction: column; text-align: center; gap: 15px; }
            .time-grid { grid-template-columns: 1fr 1fr; }
                 }
    </style>
</head>
<body>

    <div class="hero-box">
        <div class="hero-content">
            <!-- Replace doctor.jpg with your photo name if different -->
            <img src="doctor.jpg" alt="دكتور محمد" class="profile-pic">
            <div class="hero-text">
                <h1>عيادة الدكتور محمد برهان</h1>
                <p class="slogan">أسنان جميلة بدقائق معدودة</p>
            </div>
        </div>
    </div>

    <div class="container">
        <div class="info-strip">📍 كركوك | 🕒 2:00 م - 8:00 م</div>

        <div id="bookingForm">
            <label>اسم المريض الكامل:</label>
            <input type="text" id="pName" placeholder="أدخل اسمك هنا...">

            <label>نوع المعالجة:</label>
            <select id="pReason">
                <option value="فحص عام">فحص عام</option>
                <option value="تنظيف أسنان">تنظيف أسنان</option>
                <option value="تقويم">استشارة تقويم</option>
                <option value="حشوات">حشوات تجميلية</option>
                <option value="قلع أسنان">قلع أسنان</option>
                <option value="تركيب أسنان">تركيب أسنان</option>
                <option value="برد أسنان (جسر)">برد أسنان (جسر)</option>
            </select>

            <label>اختر التاريخ:</label>
            <input type="date" id="pDate" onchange="loadTimes()">

            <label>الأوقات المتاحة:</label>
            <div id="timeGrid" class="time-grid">
                <p style="grid-column: span 3; color: #94a3b8; font-size: 0.85rem; text-align: center; padding: 20px;">يرجى اختيار التاريخ أولاً...</p>
            </div>

            <button class="btn-main" id="subBtn" onclick="submitBooking()" disabled>حجز الموعد الآن ✅</button>
        </div>

        <div id="success" style="display:none; text-align:center;">
            <div style="font-size: 60px; color: #25D366;">✔️</div>
            <h2>تم الحجز بنجاح!</h2>
            <p>تم تسجيل موعدك في نظام العيادة. نراك قريباً.</p>
            <button class="btn-main" onclick="location.reload()">حجز موعد جديد</button>
        </div>
    </div>

    <script>
        const scriptURL = 'PASTE_YOUR_NEW_LINK_HERE';
        let selectedTime = "";
        let bookedData = [];

        // Load data from Sheet
        function fetchBookings() {
            fetch(scriptURL).then(res => res.json()).then(data => { 
                bookedData = data; 
                console.log("Booked Data Loaded:", bookedData);
            });
        }
        fetchBookings();

        function loadTimes() {
            const date = document.getElementById('pDate').value;
            const grid = document.getElementById('timeGrid');
            grid.innerHTML = "";
            
            for (let hour = 14; hour < 20; hour++) {
                for (let min of ["00", "15", "30", "45"]) {
                    let h = hour > 12 ? hour - 12 : hour;
                    let timeLabel = `${h}:${min} م`;// SMART CHECK: Compare to Google Sheet data
                    let isBooked = bookedData.some(b => b.date.includes(date) && b.time.trim() === timeLabel.trim());
                    
                    let btn = document.createElement('div');
                    btn.className = "time-btn" + (isBooked ? " booked" : "");
                    btn.innerText = timeLabel;
                    if (!isBooked) {
                        btn.onclick = function() { 
                            document.querySelectorAll('.time-btn').forEach(b => b.classList.remove('selected'));
                            this.classList.add('selected');
                            selectedTime = timeLabel;
                            document.getElementById('subBtn').disabled = false;
                        };
                    }
                    grid.appendChild(btn);
                }
            }
        }

        function submitBooking() {
            const name = document.getElementById('pName').value;
            const date = document.getElementById('pDate').value;
            const reason = document.getElementById('pReason').value;
            if (!name || !date || !selectedTime) return;
            document.getElementById('subBtn').innerText = "جاري الحفظ...";
            document.getElementById('subBtn').disabled = true;

            fetch(scriptURL, { method: 'POST', mode: 'no-cors', body: JSON.stringify({ name, date, time: selectedTime, reason }) })
            .then(() => {
                document.getElementById('bookingForm').style.display = 'none';
                document.getElementById('success').style.display = 'block';
            });
        }
    </script>
</body>
</html>
        }
