<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>حجز موعد - عيادة الدكتور محمد برهان</title>
    <style>
        :root { --primary: #0077b6; --bg: #f0f7f9; }
        body { font-family: 'Segoe UI', Tahoma, sans-serif; margin: 0; background-color: var(--bg); direction: rtl; }
        header { background-color: var(--primary); color: white; padding: 25px; text-align: center; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        .container { max-width: 500px; margin: 20px auto; background: white; padding: 30px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.05); }
        .info-box { background: #e9f5f8; padding: 15px; border-radius: 12px; margin-bottom: 25px; color: var(--primary); font-weight: bold; text-align: center; }
        
        label { display: block; margin-bottom: 8px; font-weight: bold; color: #333; }
        input { width: 100%; padding: 14px; margin-bottom: 20px; border: 1px solid #ddd; border-radius: 10px; box-sizing: border-box; font-size: 1rem; }
        
        .btn-confirm { background-color: var(--primary); color: white; border: none; padding: 18px; width: 100%; border-radius: 10px; font-size: 1.2rem; font-weight: bold; cursor: pointer; transition: 0.3s; }
        .btn-confirm:disabled { background-color: #ccc; cursor: not-allowed; }
        
        #successMsg { display: none; text-align: center; padding: 20px; }
        .success-icon { font-size: 50px; color: #25D366; margin-bottom: 10px; }
    </style>
</head>
<body>

    <header>
        <h1>عيادة الدكتور محمد برهان</h1>
        <p>نظام حجز المواعيد الإلكتروني</p>
    </header>

    <div class="container" id="bookingForm">
        <div class="info-box">📍 كركوك | 📞 07709126081</div>

        <label>الاسم الكامل للمريض:</label>
        <input type="text" id="patientName" placeholder="اكتب اسمك هنا...">

        <label>اختر التاريخ:</label>
        <input type="date" id="bookingDate">

        <label>اختر الوقت:</label>
        <input type="time" id="bookingTime">

        <button class="btn-confirm" id="submitBtn" onclick="sendToSheet()">تأكيد الحجز الآن ✅</button>
    </div>

    <div class="container" id="successMsg">
        <div class="success-icon">✔️</div>
        <h2>تم استلام طلبك!</h2>
        <p>شكراً لك. لقد تم تسجيل موعدك في نظام العيادة بنجاح.</p>
        <button class="btn-confirm" onclick="location.reload()">حجز موعد آخر</button>
    </div>

    <script>
        function sendToSheet() {
            const btn = document.getElementById('submitBtn');
            const scriptURL = 'https://script.google.com/macros/s/AKfycbyFdyEq_1QuSzn1_EaLVNjUmtWsgtLDgzWgYXHX_Utp3YW04OyNdNTZhjCratoTbMJpQQ/exec';

            const name = document.getElementById('patientName').value;
            const date = document.getElementById('bookingDate').value;
            const time = document.getElementById('bookingTime').value;

            if (!name || !date || !time) {
                alert("يرجى ملء جميع الحقول");
                return;
            }

            btn.innerText = "جاري الحفظ...";
            btn.disabled = true;

            const data = { name: name, date: date, time: time };

            fetch(scriptURL, {
                method: 'POST',
                mode: 'no-cors',
                cache: 'no-cache',
                body: JSON.stringify(data)
            })
            .then(() => {
                document.getElementById('bookingForm').style.display = 'none';
                document.getElementById('successMsg').style.display = 'block';
            })
            .catch(() => {
                alert("حدث خطأ. يرجى المحاولة مرة أخرى.");
                btn.disabled = false;
                btn.innerText = "تأكيد الحجز الآن ✅";  }); }
    </script>
</body>
</html>
