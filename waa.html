<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة الحجز - عيادة د. محمد برهان</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
    <style>
        :root { --dark: #003459; --accent: #0077b6; }
        body { font-family: 'Segoe UI', sans-serif; background-color: #f0f4f8; margin: 0; direction: rtl; padding: 15px; }
        header { background: var(--dark); color: white; padding: 20px; text-align: center; border-radius: 15px; margin-bottom: 20px; display: flex; align-items: center; justify-content: space-between; }
        .card { background: white; padding: 20px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.05); overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; }
        th { text-align: right; padding: 12px; color: #64748b; border-bottom: 2px solid #f1f5f9; }
        td { padding: 12px; border-bottom: 1px solid #f1f5f9; }
        .btn { border: none; padding: 8px 12px; border-radius: 8px; cursor: pointer; font-weight: bold; font-size: 0.8rem; }
        .btn-history { background: #e0f2fe; color: #0077b6; }
        .btn-delete { background: #fee2e2; color: #ef4444; }
        /* POPUP MODAL */
        #historyModal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); z-index: 1000; }
        .modal-content { background: white; width: 90%; max-width: 500px; margin: 30px auto; padding: 25px; border-radius: 25px; position: relative; }
        textarea { width: 100%; height: 100px; margin-top: 10px; border-radius: 12px; padding: 12px; border: 1px solid #ddd; box-sizing: border-box; font-size: 1rem; }
    </style>
</head>
<body>

    <header>
        <div style="width:40px;"></div>
        <h1>إدارة العيادة والسجلات</h1>
        <button onclick="firebase.auth().signOut()" style="background:rgba(255,255,255,0.1); border:1px solid white; color:white; border-radius:8px; padding:8px 15px; cursor:pointer;">خروج</button>
    </header>

    <div class="card">
        <table>
            <thead>
                <tr>
                    <th>المريض</th>
                    <th>الموعد</th>
                    <th>السجل الطبي</th>
                    <th>إجراء</th>
                </tr>
            </thead>
            <tbody id="tableBody"></tbody>
        </table>
    </div>

    <!-- POPUP FOR NOTES -->
    <div id="historyModal">
        <div class="modal-content">
            <span onclick="closeHistory()" style="position:absolute; left:20px; top:15px; cursor:pointer; font-size:1.5rem;">&times;</span>
            <h2 id="modalTitle" style="color:var(--dark);">السجل الطبي</h2>
            <div id="historyList" style="max-height:250px; overflow-y:auto; margin-bottom:15px; background:#f8fafc; border-radius:10px; padding:10px;"></div>
            <label style="font-weight:bold;">إضافة ملاحظة جديدة:</label>
            <textarea id="historyNote" placeholder="اكتب تفاصيل العلاج هنا..."></textarea>
            <button onclick="saveNote()" style="background:var(--accent); color:white; width:100%; padding:15px; border:none; border-radius:12px; margin-top:15px; font-weight:bold;">حفظ في السجل 💾</button>
        </div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyDqMEr5yKTjN3GV5osJmwW_2hdKVQOzFWs",
            authDomain: "dentalclinicbooking-system.firebaseapp.com",
            projectId: "dentalclinicbooking-system",
            storageBucket: "dentalclinicbooking-system.firebasestorage.app",
            messagingSenderId: "892853005967",
            appId: "1:892853005967:web:1a5fb182c073eba1ee0afa"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        // --- ADMIN LIST ---
        const ADMINS = ["dr.mohamed@gmail.com", "YOUR_EMAIL@gmail.com"]; 
        let activePatientName = "";

        firebase.auth().onAuthStateChanged((user) => {
            if (user) {
                const isAdmin = ADMINS.includes(user.email);
                loadBookings(isAdmin);
            } else {
                window.location.href = "login.html";
            }
        });

        function loadBookings(isAdmin) {
            db.collection("bookings").orderBy("timestamp", "desc").onSnapshot((snapshot) => {
                const tableBody = document.getElementById('tableBody');
                tableBody.innerHTML = "";
                snapshot.forEach((doc) => {
                    const data = doc.data();
                    const phoneLink = `<a href="tel:${data.phone}" style="color:#0077b6; text-decoration:none; font-weight:bold;">${data.phone}</a>`;
                    
                        // Use Triple Name for History
                    const historyBtn = isAdmin ? `<button class="btn btn-history" onclick="openHistory('${data.name}')">السجل 📂</button>` : `<span style="color:#cbd5e1;">خاص بالطبيب</span>`;
                    
                    tableBody.innerHTML += `
                        <tr>
                            <td><strong>${data.name}</strong><br><small>${phoneLink}</small></td>
                            <td>${data.date}<br><small>${data.time}</small></td>
                            <td>${historyBtn}</td>
                            <td><button class="btn btn-delete" onclick="deleteBooking('${doc.id}')">حذف</button></td>
                        </tr>
                    `;
                });
            });
        }

        async function openHistory(name) {
            activePatientName = name;
            document.getElementById('modalTitle').innerText = "سجل المريض: " + name;
            document.getElementById('historyModal').style.display = 'block';
            
            const snapshot = await db.collection("medicalHistory").where("patientName", "==", name).orderBy("timestamp", "desc").get();
            const list = document.getElementById('historyList');
            list.innerHTML = snapshot.empty ? "لا يوجد سجل سابق لهذا الاسم" : "";
            snapshot.forEach(doc => {
                const d = doc.data();
                list.innerHTML += `<div style="padding:10px; border-bottom:1px solid #eee;"><small>${d.date}</small><br><strong>${d.note}</strong></div>`;
            });
        }

        function saveNote() {
            const note = document.getElementById('historyNote').value;
            if(!note) return;
            db.collection("medicalHistory").add({
                patientName: activePatientName,
                note: note,
                date: new Date().toLocaleDateString('ar-EG'),
                timestamp: firebase.firestore.FieldValue.serverTimestamp()
            }).then(() => {
                document.getElementById('historyNote').value = "";
                openHistory(activePatientName);
            });
        }
function closeHistory() { document.getElementById('historyModal').style.display = 'none'; }
        function deleteBooking(id) { if(confirm("حذف الموعد؟")) db.collection("bookings").doc(id).delete(); }
    </script>
</body>
</html>
