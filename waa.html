          <!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>حجز موعد - د. محمد برهان</title>
          <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>
    <style>
        :root { 
            --premium-blue: #003459; 
            --accent-blue: #0077b6;
            --soft-bg: #f8fafc;
        }

        body { 
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; 
            margin: 0; 
            background-color: var(--soft-bg); 
            direction: rtl; 
            color: #1e293b;
        }

        /* PREMIUM GRADIENT HEADER */
        .hero-section {
            background: linear-gradient(rgba(0, 52, 89, 0.85), rgba(0, 119, 182, 0.85)), url('https://images.unsplash.com/photo-1629909613654-28e377c37b09?auto=format&fit=crop&q=80&w=1000');
background-size: cover; background-position: 
            padding: 60px 20px 80px 20px;
            color: white;
            position: relative;
            overflow: hidden;
        }

        /* Subtle background pattern */
        .hero-section::before {
            content: "";
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background-image: url('https://www.transparenttextures.com/patterns/cubes.png');
            opacity: 0.1;
        }

        .hero-container {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 25px;
            max-width: 650px;
            margin: 0 auto;
            position: relative;
            z-index: 1;
        }

        .profile-pic {
            width: 130px; 
            height: 130px;
            border-radius: 50%;
            border: 4px solid rgba(255,255,255,0.4);
            object-fit: cover;
            object-position: center 10%;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }

        .hero-text { text-align: right; }
        .hero-text h1 { margin: 0; font-size: 1.8rem; font-weight: 800; letter-spacing: -0.5px; }
        .specialty { font-size: 1.1rem; margin: 5px 0; color: #caf0f8; font-weight: 500; }
        .slogan { font-size: 0.95rem; opacity: 0.8; font-style: italic; background: rgba(255,255,255,0.1); padding: 4px 12px; border-radius: 20px; display: inline-block; margin-top: 10px; }

        /* FLOATING INFO BAR */
        .info-strip {
            background: white;
            max-width: 500px;
            margin: -35px auto 30px auto;
            padding: 18px;
            border-radius: 20px;
            display: flex;
            justify-content: space-around;
            box-shadow: 0 15px 35px rgba(0,0,0,0.1);
            font-weight: bold;
            color: var(--premium-blue);
            position: relative;
            z-index: 2;
        }

        /* MODERN FORM */
        .container { 
            max-width: 500px; 
            margin: 0 auto 60px auto; 
            background: white; 
            padding: 35px; 
            border-radius: 30px; 
            box-shadow: 0 20px 50px rgba(0,0,0,0.05);
            box-sizing: border-box;
        }
        
        label { display: block; margin: 25px 0 10px; font-weight: 700; color: #334155; font-size: 0.95rem; }
        input, select { 
            width: 100%; padding: 16px; border: 2px solid #f1f5f9; border-radius: 15px; 
            font-size: 1rem; box-sizing: border-box; background: #fbfcfd; transition: 0.3s;
        }
        input:focus, select:focus { border-color: var(--accent-blue); outline: none; background: white; }
        
        /* TIME GRID */
        .time-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-top: 15px; }
        .time-btn { padding: 14px; border: 1px solid #e2e8f0; color: var(--premium-blue); border-radius: 12px; cursor: pointer; font-weight: 700; font-size: 0.85rem; text-align: center; transition: 0.2s; background: white; }
        .time-btn:hover { border-color: var(--accent-blue); background: #f0f9ff; }
        .time-btn.selected { background: var(--accent-blue); color: white; border-color: var(--accent-blue); transform: scale(1.03); }

        .btn-confirm { 
            background: var(--premium-blue); 
            color: white; border: none; padding: 20px; width: 100%; 
            border-radius: 18px; font-size: 1.2rem; font-weight: 800; cursor: pointer; 
            margin-top: 40px; box-shadow: 0 10px 25px rgba(0, 52, 89, 0.2); 
        }

        #success { display: none; text-align: center; padding: 40px 10px; }

        @media (max-width: 500px) {
            .hero-container { gap: 15px; }
            .profile-pic { width: 100px; height: 100px; }
            .hero-text h1 { font-size: 1.5rem; }
            .time-grid { grid-template-columns: repeat(2, 1fr); }
        }
    </style>
</head>
<body>
    <div class="hero-section">
        <div class="hero-container">
            <!-- DOCTOR PHOTO -->
            <img src="IMG_20260203_233626_888~2.jpg" class="profile-pic">
            <!-- DOCTOR TEXT -->
            <div class="hero-text">
                <h1>عيادة د. محمد برهان</h1>
                <h2 class="specialty">زراعة و تجميل الأسنان</h2>
            </div>
        </div>
    </div>

    <div class="info-strip">
        <span>📍 كركوك</span>
        <span>📞 07709126081</span>
    </div>

    <div class="container">
        <div id="formBody">
            <label>اسم المريض الكامل:</label>
            <input type="text" id="pName" placeholder="مثال: أحمد علي حسن">
            <label>نوع المعالجة:</label>
            <select id="pReason">
                <option value="فحص عام">فحص عام</option>
                <option value="تنظيف أسنان">تنظيف أسنان</option>
                <option value="حشوات تجميلية">حشوات تجميلية</option>
                <option value="قلع أسنان">قلع أسنان</option>
                <option value="تركيب أسنان">تركيب أسنان</option>
                <option value="برد أسنان (جسر)">برد أسنان (جسر)</option>
                <option value="تقويم">استشارة تقويم</option>
            </select>

            <label>اختر التاريخ:</label>
            <input type="date" id="pDate" onchange="refreshSlots()">

            <label>الأوقات المتاحة:</label>
            <div id="timeGrid" class="time-grid">
                <p style="grid-column: span 3; color: #94a3b8; font-size: 0.85rem; text-align: center; padding: 10px;">يرجى اختيار التاريخ أولاً...</p>
            </div>

            <button class="btn-confirm" id="subBtn" onclick="submitBooking()" disabled>تأكيد الحجز الآن ✅</button>
        </div>

        <div id="success">
            <div style="font-size: 60px; color: #25D366; margin-bottom: 15px;">✔️</div>
            <h2 style="color:var(--premium-blue)">تم الحجز بنجاح!</h2>
            <p>لقد تم تسجيل موعدك في نظام العيادة.نراك قريباً.</p>
            <button class="btn-confirm" onclick="location.reload()">حجز موعد جديد</button>
        </div>
    </div>

    <script>
        const scriptURL = 'https://script.google.com/macros/s/AKfycbzipyxVvENvlxr98FgpzSwo7rmE93O3T7IINJh79HE-F0j4f1Y_y_6Vz5jAT4t7JokrEw/exec'; // <--- PUT YOUR LINK HERE
        let selectedTime = "";
        let bookedData = [];

        fetch(scriptURL).then(res => res.json()).then(data => { bookedData = data; });

        function refreshSlots() {
            const dateInput = document.getElementById('pDate').value;
            const grid = document.getElementById('timeGrid');
            grid.innerHTML = "";
            
            // --- FRIDAY CHECK START ---
            const selectedDate = new Date(dateInput);
            const dayOfWeek = selectedDate.getDay(); // 5 = Friday

            if (dayOfWeek === 5) {
                grid.innerHTML = "<p style='grid-column: span 3; color: #ef4444; font-weight: bold; padding: 20px;'>العيادة مغلقة يوم الجمعة. يرجى اختيار يوم آخر.</p>";
                document.getElementById('subBtn').disabled = true;
                return; // Stop the code here so no times show up
            }
            // --- FRIDAY CHECK END ---

            for (let hour = 14; hour < 20; hour++) {
                for (let min of ["00", "15", "30", "45"]) {
                    let h = hour > 12 ? hour - 12 : hour;
                    let timeLabel = `${h}:${min} م`;
                    let isBooked = bookedData.some(b => b.date === dateInput && b.time.trim() === timeLabel.trim());
                    if (!isBooked) {
                        let btn = document.createElement('div');
                        btn.className = "time-btn";
                        btn.innerText = timeLabel;
                        btn.onclick = function() { 
                            document.querySelectorAll('.time-btn').forEach(b => b.classList.remove('selected'));
                            this.classList.add('selected');
                            selectedTime = timeLabel;
                            document.getElementById('subBtn').disabled = false;
                        };
                        grid.appendChild(btn);
                    }
                }
            }
        }

        function submitBooking() {
            const name = document.getElementById('pName').value;
            const date = document.getElementById('pDate').value;
            const reason = document.getElementById('pReason').value;
            document.getElementById('subBtn').innerText = "جاري الحفظ...";
            fetch(scriptURL, { method: 'POST', mode: 'no-cors', body: JSON.stringify({ name, date, time: selectedTime, reason }) })
            .then(() => {document.getElementById('formBody').style.display = 'none';
                document.getElementById('success').style.display = 'block';
            });
        }
    </script>
</body>
</html>
