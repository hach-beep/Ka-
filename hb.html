<!DOCTYPE html>
<html lang="en">
<head>

    <!-- Importing a nice font -->

    <!-- Confetti Library -->

    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background-color: #f4f7f6;
            text-align: center;
            padding: 20px;
            color: #333;
        }

        h1 { font-family: 'Dancing Script', cursive; color: #2c3e50; font-size: 3rem; margin-bottom: 10px; }
        p.subtitle { margin-bottom: 30px; color: #7f8c8d; }

        .envelope-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            max-width: 1000px;
            margin: 0 auto;
        }

        .envelope {
            background: #ffffff;
            border: 2px solid #e0e0e0;
            border-radius: 15px;
            padding: 30px;
            cursor: pointer;
            transition: transform 0.3s, box-shadow 0.3s;
            position: relative;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        .envelope:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 20px rgba(0,0,0,0.15);
            border-color: #3498db;
        }

        .envelope i { font-size: 2rem; display: block; margin-bottom: 10px; }

        /* Modal Styles */
        #modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8);
            justify-content: center;
            align-items: center;
            z-index: 100;
            padding: 20px;
        }

        .modal-content {
            background: white;
            padding: 40px;
            border-radius: 20px;
            max-width: 500px;
            position: relative;
            animation: openLetter 0.5s ease-out;
        }

        @keyframes openLetter {
            from { transform: scale(0.5); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }

        .close-btn {
            position: absolute;
            top: 10px; right: 15px;
            font-size: 24px; cursor: pointer; color: #999;
        }

        .letter-text { line-height: 1.6; font-size: 1.1rem; }
    </style>
</head>
