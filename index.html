<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A Special Question ❤️</title>
    <style>
        body {
            background-color: #ffeef2; /* Light pink background */
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            font-family: 'Comic Sans MS', cursive, sans-serif;text-align: center;
        }

        .container {
            background: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            position: relative;
        }

        h1 {
            color: #d63384;
            font-size: 2.5rem;
        }

        .gif-container img {
            max-width: 200px;
            margin-bottom: 20px;
        }
buttons {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 30px;
        }

        button {
            padding: 15px 30px;
            font-size: 1.2rem;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: transform 0.2s;
        }

        #yesBtn {
            background-color: #ff4d6d;
            color: white;
        }#noBtn {
            background-color: #adb5bd;
            color: white;
            position: absolute; /* Needed for the "escaping" trick */
        }

        #yesBtn:hover {
            transform: scale(1.1);
        }

        /* Success screen styling */
        .hidden {
            display: none;
        }
    </style>
</head>
<body>

    <div id="mainContainer" class="container">
        <div class="gif-container">
          <!-- Replace this URL with any cute GIF you like -->
            <img src="https://media.giphy.com/media/v1.Y2lkPTc5MGI3NjExOHpueG56Z3lreG56Z3lreG56Z3lreG56Z3lreG56Z3lreG56ZyZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9cw/cLS1cfxvGOPVpf9g3y/giphy.gif" alt="Cute bear">
        </div>
        <h1 id="questionText">[ bala ], will you be my Valentine? ❤️</h1>
        <div class="buttons">
            <button id="yesBtn">Yes!</button>
            <button id="noBtn">No</button>
        </div>
    </div>

    <!-- Success Screen (hidden at first) -->
    <div id="successContainer" class="container hidden">
        <div class="gif-container">
            <img src="https://media.giphy.com/media/v1.Y2lkPTc5MGI3NjExOHpueG56Z3lreG56Z3lreG56Z3lreG56Z3lreG56Z3lreG56ZyZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9cw/26FLdmIp6wJr91JAI/giphy.gif" alt="Celebration">
            </div>
        <h1>YAY! See you on the 14th! 😘</h1>
    </div>

    <script>
        const noBtn = document.getElementById('noBtn');
        const yesBtn = document.getElementById('yesBtn');
        const mainContainer = document.getElementById('mainContainer');
        const successContainer = document.getElementById('successContainer');

        // The "Moving No Button" Logic
        noBtn.addEventListener('mouseover', () => {
            const maxX = window.innerWidth - noBtn.offsetWidth;
            const maxY = window.innerHeight - noBtn.offsetHeight;const randomX = Math.floor(Math.random() * maxX);
            const randomY = Math.floor(Math.random() * maxY);

            noBtn.style.left = randomX + 'px';
            noBtn.style.top = randomY + 'px';
        });

        // The "Yes" Button Logic
        yesBtn.addEventListener('click', () => {
            mainContainer.classList.add('hidden');
            successContainer.classList.remove('hidden');
        });
    </script>
</body>
</html>
