name: Build Android APK
on: [push]
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v3
      - name: Setup .NET
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: 8.0.x
      - name: Install MAUI
        run: dotnet workload install maui
      - name: Build Android
        run: dotnet publish MyHighEndApp/MyHighEndApp.csproj -c Release -f net8.0-android /p:AndroidPackageFormat=apk /p:AndroidKeyStore=false
      - name: Upload APK
        uses: actions/upload-artifact@v3
        with:
          name: High-End-App-Build
          path: MyHighEndApp/bin/Release/net8.0-android/*-Signed.apk
