
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>Baby Guard - تسجيل مراجع جديد</title>
    <style>
        body {
            background-color: #f0f9ff;
            font-family: 'Segoe UI', Tahoma, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .reg-card {
            background-color: white;
            padding: 40px;
            border-radius: 30px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.05);
            width: 90%;
            max-width: 400px;
            text-align: center;
        }
        label {
            display: block;
            text-align: right;
            margin-bottom: 8px;
            font-weight: bold;
            color: #005f8d;
        }
        input {
            width: 100%;
            padding: 12px;
            margin-bottom: 20px;
            border: 1px solid #e2e8f0;
            border-radius: 12px;
            box-sizing: border-box;
            font-size: 1rem;
        }
        button {
            background-color: #2a9d8f;
            color: white;
            border: none;
            padding: 15px;
            width: 100%;
            border-radius: 12px;
            font-weight: bold;
            font-size: 1.1rem;
            cursor: pointer;
            transition: 0.3s;
        }
        button:hover {
            background-color: #21867a;
            transform: translateY(-3px);
        }
    </style>
</head>
<body>

    <div class="reg-card">
        <h1> تسجيل مراجع جديد </h1>
        
        <label>اسم الطفل الثلاثي:</label>
        <input type="text" id="babyName" placeholder="أدخل اسم الطفل">

        <label>تاريخ الولادة:</label>
        <input type="date" id="babyDob">

        <label>رقم هاتف الأم:</label>
        <input type="tel" id="momPhone" placeholder="0770...">

        <button onclick="registerBaby()">حفظ البيانات</button>
    </div>
    <!-- 1. Load the Firebase Libraries -->
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>

<script>
    // 2. Your NEW Firebase Keys
    const firebaseConfig = {
        apiKey: "AIzaSyAX35fTT2-D9OQgKQkzgNJCQTtcN0S2LwQ",
        authDomain: "babyguard-system.firebaseapp.com",
        projectId: "babyguard-system",
        storageBucket: "babyguard-system.firebasestorage.app",
        messagingSenderId: "834481617596",
        appId: "1:834481617596:web:868391d8b73a5feabc6eb9"
    };
    
    // 3. Start the Engine
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    function registerBaby() {
    // 1. Grab data
    const name = document.getElementById('babyName').value;
    const dob = document.getElementById('babyDob').value;
    const phone = document.getElementById('momPhone').value;

    // 2. Simple Validation
    if (!name || !dob || !phone) {
        alert("يرجى إكمال جميع الحقول");
        return;
    }

    console.log("Attempting to save..."); // Check your browser console (F12)

    // 3. Save to Firebase
    db.collection("babies").add({
        name: name,
        dob: dob,
        momPhone: phone,
        completedVaccines: [0], // Start with first vaccine done
        timestamp: firebase.firestore.FieldValue.serverTimestamp()
    })
    .then((docRef) => {
        console.log("Document written with ID: ", docRef.id);
        // CRITICAL: Use backticks `` here, NOT single quotes ''
        window.location.href = `baby_dash.html?id=${docRef.id}`;
    })
    .catch((error) => {
        alert("خطأ في الاتصال بقاعدة البيانات: " + error.message);
        console.error("Error adding document: ", error);
    });
    }
        </script>

</body>
</html>
