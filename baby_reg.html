<!DOCTYPE html>
<html lang="ar" dor="rtl">
  <head>
    <meta charset="UTF-8">
    <tittle>تسجيل مراجع جديد_ Baby guard </tittle>
    <style>
    
    body {
        background-color: #f0f9ff; /* Soft baby blue */
        font-family: 'Segoe UI', Tahoma, sans-serif;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        margin: 0;
    }
    .reg-card {
        background-color: white;
        padding: 40px;
        border-radius: 30px;
        box-shadow: 0 15px 35px rgba(0,0,0,0.05);
        width: 90%;
        max-width: 400px;
        text-align: center;
    }
      label {
        display: block;
        text-align: right;
        margin-bottom: 8px;
        font-weight: bold;
        color: #005f8d;
    }

    input {
        width: 100%;
        padding: 12px;
        margin-bottom: 20px;
        border: 1px solid #e2e8f0;
        border-radius: 12px;
        box-sizing: border-box; /* This keeps the box from getting too wide */
        font-size: 1rem;
    }

    button {
        background-color: #2a9d8f;
        color: white;
        border: none;
        padding: 15px;
        width: 100%;
        border-radius: 12px;
        font-weight: bold;
        font-size: 1.1rem;
        cursor: pointer;
        transition: 0.3s;
    }

    button:hover {
        background-color: #21867a;
        transform: translateY(-3px);
    }
    </style>
  </head>
  
  <body>
    <div class="reg-card>
    <h1>تسجيل مراجع جديد</h1>
    <label>اسم الطفل الثلاثي:</label>
    <input type="text" id=babyname" 
    placeholder="اسم الطفل الثلاثي">
    <label>تاريخ الولادة:</label>
    <input type="date" id="babyDOF">
    <label type="tel" id"momphone"
      placeholder"مثال 0770..."
      <button onclick="registerbaby"()">
    حفظ البيانات </button>
    </label>
  </body>
